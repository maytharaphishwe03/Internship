<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Content</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: aquamarine;
            padding: 50px;
        }

        .box {
            background-color: bisque;
            padding: 50px;
            margin: auto;
            width: 70%;
            max-width: 700px;
            height: auto;
            border: 10px solid red;
            border-radius: 20px;
        }

        h1 {
            background-color: aliceblue;
            padding: 90px;
            border-radius: 20px;
            text-align: center;
        }

    </style>
</head>
<body>
    
    <div class="box">
        <h1>Card Content</h1>
    </div>

    <script>
        let score=10;
        console.log(score);

        score = 70;
        console.log(score);
    </script>

    
    
</body>
</html>
