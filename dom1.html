<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live DOM Update</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #eef1f5;
    margin: 0;
    padding: 40px;
}

.container {
    display: flex;
    gap: 50px;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.left, .right {
    flex: 1;
}

h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input[type="text"],
input[type="number"] {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

input[type="color"] {
    margin-top: 10px;
    height: 40px;
    width: 80px;
    border: none;
}

.card {
    background: #f5f5f5;
    padding: 20px;
    border-radius: 12px;
    border: 2px solid #333;
    width: 250px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.vip-badge {
    display: inline-block;
    background: gold;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 10px;
}

.hidden {
    display: none;
}
</style>
</head>
<body>

<div class="container">
    
    <div class="left">
        <h2>Update Variables</h2>

        <label>Name (String):</label>
        <input type="text" id="nameInput" value="Alex Walker">

        <label>Age (Number):</label>
        <input type="number" id="ageInput" value="">

        <label>VIP Status (Boolean):</label>
        <input type="checkbox" id="vipInput" >

        <label>Card Color:</label>
        <input type="color" id="colorInput" value="#f5f5f5">
    </div>

    <div class="right">
        <h2>Live DOM Output</h2>

        <div class="card" id="card">
            <div id="vipBadge" class="vip-badge">VIP MEMBER</div>
            <h3 id="displayName">Alex Walker</h3>
            <p id="displayAge">Age: 28</p>
        </div>
    </div>

</div>

<script>
const nameInput = document.getElementById("nameInput");
const ageInput = document.getElementById("ageInput");
const vipInput = document.getElementById("vipInput");
const colorInput = document.getElementById("colorInput");

const displayName = document.getElementById("displayName");
const displayAge = document.getElementById("displayAge");
const vipBadge = document.getElementById("vipBadge");
const card = document.getElementById("card");

function updateDOM() {
    displayName.textContent = nameInput.value;
    displayAge.textContent = "Age: " + ageInput.value;

    if (vipInput.checked) {
        vipBadge.classList.remove("hidden");
    } else {
        vipBadge.classList.add("hidden");
    }

    card.style.backgroundColor = colorInput.value;
}

nameInput.addEventListener("input", updateDOM);
ageInput.addEventListener("input", updateDOM);
vipInput.addEventListener("change", updateDOM);
colorInput.addEventListener("input", updateDOM);

updateDOM();
</script>

</body>
</html>
