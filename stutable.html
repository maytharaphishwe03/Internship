<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpg" href="bow.jpg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        table {
            border-collapse: collapse; 
            width: 100%;
            max-width: 900px;
            margin: auto;
        } 

        th, td {
            border: 2px solid #333;
            text-align: center;
            padding: 10px;
        }

    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">Student Name</th>
            <th rowspan="2">Gender</th>
            <th rowspan="2">Roll No.</th>
            <th colspan="3">Marks</th>
        </tr>
        <tr>
            <th>Myanmar</th>
            <th>English</th>
            <th>Maths</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Su Su</td>
            <td rowspan="2">Female</td>
            <td>5CS-32</td>
            <td>60</td>
            <td>75</td>
            <td>86</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Moe Moe</td>
            <td>5CS-33</td>
            <td>78</td>
            <td>86</td>
            <td>84</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Kyaw Kyaw</td>
            <td rowspan="3">Male</td>
            <td>5CS-34</td>
            <td>89</td>
            <td>43</td>
            <td>86</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Mg Mg</td>
            <td>5CS-35</td>
            <td>76</td>
            <td>75</td>
            <td>75</td>
        </tr>

        <tr>
            <td>5</td>
            <td>Aung Aung</td>
            <td>5CS-36</td>
            <td>87</td>
            <td>75</td>
            <td>86</td>
        </tr>
    </table>

</body>
</html>
