<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="nabi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utility UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>CSS Utility Simulator</h1>
      <p class="sub">
        Change the inputs below to see how atomic classes combine to build UIs.
      </p>
      <div class="navbar">
        <div class="logo">
          <img src="logo.png" alt="Logo" />
        </div>

        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Contact</li>
        </ul>
      </div>

      <div class="features">
        <div class="feature-box">Feature 1</div>
        <div class="feature-box">Feature 2</div>
        <div class="feature-box">Feature 3</div>
      </div>

      <div class="main">
        <div class="left-box">
          <h2>Utility Controls</h2>

          <label>Padding (Spacing)</label>
          <select>
            <option>Medium (p-8)</option>
          </select>

          <label>Background Theme (Colors)</label>
          <select>
            <option>Primary Blue</option>
          </select>

          <label>Text Size (Typography)</label>
          <select>
            <option>Large (text-xl)</option>
          </select>

          <label>Corner radius (Borders)</label>
          <select>
            <option>Square (roundedf-none)</option>
          </select>

          <label>Shadow (Depth)</label>
          <select>
            <option>Medium (shadow-md)</option>
          </select>
        </div>

        <div class="right-box">
          <div class="card">
            <h3>Alex Walker</h3>
            <p>
              Full-stack web developer building <br />
              awesome things with Tailwind CSS.
            </p>
          </div>
        </div>
      </div>

      <div class="buttons">
        <button>Submit</button>
        <button>Hover Me Slowly!</button>
      </div>
    </div>
  </body>
</html>
